    "hf-xet>=1.1.5",
    "ipykernel>=6.30.0",
    "matplotlib>=3.10.3",
    "networkx>=3.0",
    "pandas>=2.0",
    "plotly>=6.2.0",
    "scikit-learn>=1.7.1",
    "scipy>=1.16.1",
    "seaborn>=0.13.2",
    "streamlit>=1.47.1",
    "torch>=2.7.1,<2.8",
    "torch-geometric>=2.6.1",
    "transformers>=4.54.0",
]

